<!-- Theme Switcher Dropdown (Reusable Component) -->
<div class="dropdown theme-dropdown d-inline-block">
  <button class="btn btn-sm dropdown-toggle theme-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="Switch Visual Theme">
    <i class="fas fa-palette me-1"></i>
    <span class="theme-active-label d-none d-sm-inline">Signature Gold</span>
  </button>
  <ul class="dropdown-menu dropdown-menu-end theme-menu shadow-lg">
    <li class="dropdown-header small text-uppercase fw-bold text-muted px-2 py-1">
      <i class="fas fa-paint-brush me-1 text-gold"></i> Choose Appearance
    </li>
    <li>
      <button class="dropdown-item rounded d-flex align-items-center gap-2 py-2 theme-choice" data-theme-value="luxury-gold">
        <span class="theme-swatch" style="background: linear-gradient(135deg, #F2D07C, #D4AF37 50%, #FAF9F6 100%); border: 1.5px solid #D4AF37;"></span>
        <div class="flex-grow-1">
          <div class="fw-semibold">Signature Gold</div>
          <small class="text-muted d-block" style="font-size: 0.72rem;">Signature Gold &amp; Warm Pearl</small>
        </div>
        <i class="fas fa-check text-gold ms-auto theme-check d-none"></i>
      </button>
    </li>
    <li>
      <button class="dropdown-item rounded d-flex align-items-center gap-2 py-2 theme-choice" data-theme-value="sapphire-blue">
        <span class="theme-swatch" style="background: linear-gradient(135deg, #60A5FA, #2563EB 50%, #F0F6FF 100%); border: 1.5px solid #3B82F6;"></span>
        <div class="flex-grow-1">
          <div class="fw-semibold">Sapphire Royal</div>
          <small class="text-muted d-block" style="font-size: 0.72rem;">Ocean Royal &amp; Clean Blue</small>
        </div>
        <i class="fas fa-check text-info ms-auto theme-check d-none"></i>
      </button>
    </li>
    <li>
      <button class="dropdown-item rounded d-flex align-items-center gap-2 py-2 theme-choice" data-theme-value="emerald-green">
        <span class="theme-swatch" style="background: linear-gradient(135deg, #34D399, #10B981 50%, #F0FDF4 100%); border: 1.5px solid #10B981;"></span>
        <div class="flex-grow-1">
          <div class="fw-semibold">Emerald Prestige</div>
          <small class="text-muted d-block" style="font-size: 0.72rem;">Forest Jade &amp; Mint Light</small>
        </div>
        <i class="fas fa-check text-success ms-auto theme-check d-none"></i>
      </button>
    </li>
    <li>
      <button class="dropdown-item rounded d-flex align-items-center gap-2 py-2 theme-choice" data-theme-value="amethyst-purple">
        <span class="theme-swatch" style="background: linear-gradient(135deg, #C084FC, #A855F7 50%, #FAF5FF 100%); border: 1.5px solid #A855F7;"></span>
        <div class="flex-grow-1">
          <div class="fw-semibold">Velvet Amethyst</div>
          <small class="text-muted d-block" style="font-size: 0.72rem;">Regal Plum &amp; Lavender Light</small>
        </div>
        <i class="fas fa-check ms-auto theme-check d-none" style="color: #C084FC;"></i>
      </button>
    </li>
    <li>
      <button class="dropdown-item rounded d-flex align-items-center gap-2 py-2 theme-choice" data-theme-value="executive-light">
        <span class="theme-swatch" style="background: linear-gradient(135deg, #CBD5E1, #3B82F6 50%, #FFFFFF 100%); border: 1.5px solid #CBD5E1;"></span>
        <div class="flex-grow-1">
          <div class="fw-semibold">Platinum Pearl</div>
          <small class="text-muted d-block" style="font-size: 0.72rem;">Clean Modern Light Slate</small>
        </div>
        <i class="fas fa-check text-primary ms-auto theme-check d-none"></i>
      </button>
    </li>
    <li>
      <button class="dropdown-item rounded d-flex align-items-center gap-2 py-2 theme-choice" data-theme-value="midnight-ivory">
        <span class="theme-swatch" style="background: linear-gradient(135deg, #D6AD60 50%, #F4F1EA 50%); border: 1.5px solid #D6AD60;"></span>
        <div class="flex-grow-1">
          <div class="fw-semibold">Midnight &amp; Ivory</div>
          <small class="text-muted d-block" style="font-size: 0.72rem;">Warm Ivory &amp; Champagne Gold</small>
        </div>
        <i class="fas fa-check ms-auto theme-check d-none" style="color: #D6AD60;"></i>
      </button>
    </li>
  </ul>
</div>
